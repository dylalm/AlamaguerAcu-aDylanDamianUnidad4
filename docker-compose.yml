name: manovecina

# Estructura:
#   navegador --HTTPS--> balanceador (Nginx) --> app1 / app2 / app3 (Nginx + PHP-FPM) --> db (MySQL)

x-imagen: &imagen
  build:
    context: .
    dockerfile: Dockerfile.prod
  image: manovecina:prod

x-entorno: &entorno
  APP_NAME: ManoVecina
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL:-https://manovecina.test}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-manovecina}
  DB_USERNAME: ${DB_USERNAME:-manovecina}
  DB_PASSWORD: ${DB_PASSWORD}
  # Sesiones y caché en la base de datos: cualquier instancia puede atender a cualquier usuario
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  SEED_DEMO: ${SEED_DEMO:-true}

x-salud: &salud
  test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  # ---------- Servidor de base de datos ----------
  db:
    image: mysql:9
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-manovecina}
      MYSQL_USER: ${DB_USERNAME:-manovecina}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_datos:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [red_interna]

  # ---------- Migraciones: se ejecutan una sola vez, antes que las instancias ----------
  migraciones:
    <<: *imagen
    environment: *entorno
    command:
      - sh
      - -c
      - php artisan migrate --force && if [ "$$SEED_DEMO" = "true" ]; then php artisan db:seed --force; fi
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [red_interna]

  # ---------- Servidores de aplicaciones (tres instancias idénticas) ----------
  app1:
    <<: *imagen
    hostname: app1
    environment: *entorno
    restart: unless-stopped
    healthcheck: *salud
    depends_on:
      migraciones:
        condition: service_completed_successfully
    networks: [red_interna]

  app2:
    <<: *imagen
    hostname: app2
    environment: *entorno
    restart: unless-stopped
    healthcheck: *salud
    depends_on:
      migraciones:
        condition: service_completed_successfully
    networks: [red_interna]

  app3:
    <<: *imagen
    hostname: app3
    environment: *entorno
    restart: unless-stopped
    healthcheck: *salud
    depends_on:
      migraciones:
        condition: service_completed_successfully
    networks: [red_interna]

  # ---------- Balanceador de cargas y certificado HTTPS ----------
  balanceador:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/balanceador.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    networks: [red_interna]

networks:
  red_interna: {}

volumes:
  db_datos: {}

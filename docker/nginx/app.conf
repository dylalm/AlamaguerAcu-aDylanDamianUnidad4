# Servidor web de cada instancia de la aplicación (Nginx + PHP-FPM)
server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 10m;

    # Indica qué instancia respondió (se ve en el encabezado de la respuesta)
    add_header X-Instancia $hostname always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # Archivos ocultos (.env, .git...) nunca se sirven
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

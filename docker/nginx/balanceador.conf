# Balanceador de cargas con terminación HTTPS
upstream manovecina_app {
    least_conn;                                   # envía cada petición a la instancia con menos conexiones activas
    server app1:8080 max_fails=3 fail_timeout=10s;
    server app2:8080 max_fails=3 fail_timeout=10s;
    server app3:8080 max_fails=3 fail_timeout=10s;
}

# HTTP: redirige todo a HTTPS
server {
    listen 80;
    server_name manovecina.test localhost;
    return 301 https://$host$request_uri;
}

# HTTPS: certificado, protocolos seguros y reenvío a las instancias
server {
    listen 443 ssl;
    http2 on;
    server_name manovecina.test localhost;

    ssl_certificate     /etc/nginx/certs/manovecina.crt;
    ssl_certificate_key /etc/nginx/certs/manovecina.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Dirección de la instancia que atendió la petición
    add_header X-Servidor-Aplicacion $upstream_addr always;

    location / {
        proxy_pass http://manovecina_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si una instancia falla, se reintenta con otra
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
